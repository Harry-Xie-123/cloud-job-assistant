services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      PORT: 8080
      NODE_ENV: ${NODE_ENV:-production}
      DATA_STORE: ${DATA_STORE:-json}
      DATABASE_URL: ${DATABASE_URL:-}
      DATABASE_AUTO_MIGRATE: ${DATABASE_AUTO_MIGRATE:-true}
      DATABASE_SEED_ON_EMPTY: ${DATABASE_SEED_ON_EMPTY:-true}
      DATABASE_SSL: ${DATABASE_SSL:-false}
      ADMIN_AUTH_ENABLED: ${ADMIN_AUTH_ENABLED:-false}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      ADMIN_SESSION_SECRET: ${ADMIN_SESSION_SECRET:-}
      APP_BASE_URL: ${APP_BASE_URL:-http://localhost:8080}
      BOOKMARKLET_TOKEN: ${BOOKMARKLET_TOKEN:-}
      SEEK_API_BASE_URL: ${SEEK_API_BASE_URL:-}
      SEEK_API_KEY: ${SEEK_API_KEY:-}
      SEEK_API_KEY_HEADER: ${SEEK_API_KEY_HEADER:-authorization}
      SEEK_API_JOB_PATH_TEMPLATE: ${SEEK_API_JOB_PATH_TEMPLATE:-/jobs/{id}}

  postgres:
    image: postgres:16-alpine
    profiles:
      - postgres
    environment:
      POSTGRES_DB: cloud_job_assistant
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
